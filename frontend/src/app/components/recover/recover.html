<div class="login-container">
  <div class="card login-card">
    <h1>Recover access</h1>
    <p class="muted">
      Recovery uses a short-lived, single-use link sent to the verified email address on
      your account.
    </p>

    @if (error()) {
      <div class="panel error-panel" role="alert">{{ error() }}</div>
    }

    @if (message()) {
      <p class="panel" role="status">{{ message() }}</p>
    }

    @if (token) {
      <p class="muted">This link can be used once and expires after 15 minutes.</p>
      <button class="btn" type="button" [disabled]="submitting()" (click)="completeRecovery()">
        {{ submitting() ? 'Signing in...' : 'Sign in and recover access' }}
      </button>
    } @else {
      <div class="pref-form">
        <div class="pref-group">
          <label class="pref-label" for="recovery-email">Account email</label>
          <input
            id="recovery-email"
            class="key-input"
            type="email"
            autocomplete="email"
            [(ngModel)]="email"
            (keyup.enter)="requestRecovery()"
          />
        </div>
        <div class="btn-row">
          <button class="btn" type="button" [disabled]="submitting()" (click)="requestRecovery()">
            {{ submitting() ? 'Sending...' : 'Send recovery link' }}
          </button>
          <a class="btn btn-ghost" href="/login">Back to sign in</a>
        </div>
      </div>
    }
  </div>
</div>
