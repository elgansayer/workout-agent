<div class="profile-container" *ngIf="authService.currentUser() as user">
  <h2>User Profile</h2>
  
  <div class="card">
    <div class="user-info">
      <h3>{{ user.name || user.email }}</h3>
      <p class="email">{{ user.email }}</p>
    </div>
    
    <div class="actions">
      <button (click)="logout()" class="btn btn-danger">Log Out</button>
    </div>
  </div>
</div>
