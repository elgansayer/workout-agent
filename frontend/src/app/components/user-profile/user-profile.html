<div class="profile-container" *ngIf="authService.currentUser() as user">
  <h1>Account</h1>

  <div
    class="bg-gradient-to-br from-[#1e232c] to-[#171a21] border border-[#262c37] rounded-2xl p-4 md:p-5 my-4"
  >
    <div class="user-info">
      <h3>{{ user.name || user.email }}</h3>
      <p class="email">
        {{ user.email }}
        @if (user.email_verified) {
          <span class="status on">Verified</span>
        }
      </p>
    </div>

    <div class="pref-form" id="account-email-change">
      <h4>Change email address</h4>
      <p class="muted">
        Changing your email requires a recent sign-in. We verify the new address and send a
        security notice to your current address.
      </p>
      <div class="pref-group">
        <label class="pref-label" for="new-account-email">New email address</label>
        <input
          id="new-account-email"
          class="key-input"
          type="email"
          autocomplete="email"
          [(ngModel)]="newEmail"
          (keyup.enter)="requestEmailChange()"
        />
      </div>
      <div class="btn-row">
        <button class="btn" type="button" [disabled]="emailBusy()" (click)="requestEmailChange()">
          {{ emailBusy() ? 'Sending...' : 'Send verification link' }}
        </button>
      </div>
      <p id="email-change-status" role="status" class="key-status">{{ emailStatus() }}</p>
    </div>

    <div class="actions">
      <a href="/settings" class="btn btn-ghost">Edit coaching preferences</a>
      <button
        (click)="logout()"
        class="inline-block bg-gradient-to-br from-green-400 to-[#36c06a] text-[#07210f] font-bold text-[0.9rem] no-underline border border-transparent rounded-lg px-4 py-2 cursor-pointer transition-all duration-300 shadow-[0_2px_8px_rgba(0,0,0,0.15)] hover:brightness-110 hover:-translate-y-[1px] hover:shadow-[0_6px_20px_rgba(74,222,128,0.2)] btn-danger"
      >
        Log Out
      </button>
    </div>
  </div>
</div>
