<div class="app-layout">
  @if (auth.currentUser() !== undefined && auth.currentUser() !== null) {
  <nav class="navbar">
    <div class="navbar-brand">Workout Agent</div>
    <ul class="navbar-nav">
      <li><a routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>
      <li><a routerLink="/plan" routerLinkActive="active">Plan</a></li>
      <li><a routerLink="/history" routerLinkActive="active">History</a></li>
      <li><a routerLink="/progress" routerLinkActive="active">Progress</a></li>
      <li><a routerLink="/stats" routerLinkActive="active">Stats</a></li>
      <li><a routerLink="/chat" routerLinkActive="active">Chat</a></li>
      <li><a routerLink="/settings" routerLinkActive="active">Settings</a></li>
    </ul>
    <div class="navbar-user">
      @if (auth.currentUser()?.picture) {
        <img [src]="auth.currentUser()?.picture" alt="User Avatar" class="avatar">
      }
      <span class="user-name">{{ auth.currentUser()?.name || auth.currentUser()?.email }}</span>
      <button class="logout-btn" (click)="auth.logout()">Logout</button>
    </div>
  </nav>
  }
  
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
