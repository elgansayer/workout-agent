name: Retired Self-Healing Workflow Monitor

# Failure monitoring must report through the central VPS/OpenHands control
# plane with deduplication. The former workflow was invalid and could create
# a new high-priority issue plus an agent command for every failing run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The GitHub-hosted self-healing issue generator is retired."
          echo "No issues or agent commands were created."
