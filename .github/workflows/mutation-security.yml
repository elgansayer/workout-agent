name: Mutation Security

on:
  pull_request:
    paths:
      - backend/webapp/mutation_security.py
      - backend/webapp/__init__.py
      - backend/tests/test_mutation_security.py
      - docs/MUTATION_SECURITY.md
      - .github/workflows/mutation-security.yml
  push:
    branches: [main]
    paths:
      - backend/webapp/mutation_security.py
      - backend/webapp/__init__.py
      - backend/tests/test_mutation_security.py
      - docs/MUTATION_SECURITY.md
      - .github/workflows/mutation-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-web.txt

      - name: Install focused test dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -r backend/requirements-web.txt
          "pytest>=8,<9"

      - name: Compile mutation security boundary
        run: >-
          python -m py_compile
          backend/webapp/mutation_security.py
          backend/tests/test_mutation_security.py

      - name: Run mutation security regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_mutation_security.py
