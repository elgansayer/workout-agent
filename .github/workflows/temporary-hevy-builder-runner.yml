name: Temporary Hevy-first builder runner

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-hevy-first-builder
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.ref == 'feat/967-hevy-first-builder-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/967-hevy-first-builder-v1

      - name: Decide whether bootstrap is still required
        id: guard
        shell: bash
        run: |
          if [[ -f scripts/run_hevy_builder_bootstrap.py ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply and verify implementation
        if: steps.guard.outputs.should_run == 'true'
        id: verify
        shell: bash
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
          WEB_ALLOW_ANONYMOUS: "1"
        run: |
          set -o pipefail
          {
            set -eux
            python scripts/run_hevy_builder_bootstrap.py
            python scripts/postprocess_hevy_builder.py
            python -m pip install -r backend/requirements.txt
            python -m ruff check --fix \
              backend/dynamic_programme.py \
              backend/hevy_reader.py \
              backend/database.py \
              backend/webapp/app.py \
              backend/tests/test_dynamic_programme.py \
              backend/tests/test_webapp_programmes.py
            python -m ruff format \
              backend/dynamic_programme.py \
              backend/hevy_reader.py \
              backend/database.py \
              backend/webapp/app.py \
              backend/tests/test_dynamic_programme.py \
              backend/tests/test_webapp_programmes.py
            python -m ruff check \
              backend/dynamic_programme.py \
              backend/hevy_reader.py \
              backend/database.py \
              backend/webapp/app.py \
              backend/tests/test_dynamic_programme.py \
              backend/tests/test_webapp_programmes.py
            cd frontend
            npm ci --legacy-peer-deps
            npm run build
            cd ../backend
            python -m pytest -q \
              tests/test_dynamic_programme.py \
              tests/test_webapp_programmes.py \
              tests/test_hevy_reader.py \
              tests/test_programme_inference.py \
              tests/test_database.py
            python -m pytest -q tests
            python -m mypy dynamic_programme.py hevy_reader.py webapp/app.py
            python -m compileall -q .
            python -c "import dynamic_programme; import webapp.app; import main"
            cd ..
            if grep -R -n -E 'Available Templates|Active Split Preview|Hybrid Powerbuilding' frontend/src; then
              echo "Legacy static programme copy remains in the frontend."
              exit 1
            fi
            git diff --check
          } 2>&1 | tee hevy-builder-run.log

      - name: Publish verified implementation
        if: success() && steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          rm -f hevy-builder-run.log
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Hevy-first dynamic programme builder (#967)"
          git push origin HEAD:feat/967-hevy-first-builder-v1

      - name: Upload verification failure diagnostics
        if: failure() && steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hevy-first-builder-verification-log
          path: |
            hevy-builder-run.log
            backend/database.py
            backend/dynamic_programme.py
            backend/hevy_reader.py
            backend/webapp/app.py
            backend/tests/test_dynamic_programme.py
            backend/tests/test_webapp_programmes.py
          if-no-files-found: warn
          retention-days: 7
