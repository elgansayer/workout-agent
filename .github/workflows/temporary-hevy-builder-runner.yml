name: Temporary Hevy-first builder runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: temporary-hevy-first-builder
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: >-
      github.event.issue.number == 967 &&
      github.event.comment.body == '/run-hevy-first-builder-967-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/967-hevy-first-builder-v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply and verify implementation
        id: verify
        shell: bash
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
          WEB_ALLOW_ANONYMOUS: "1"
        run: |
          set -o pipefail
          {
            set -eux
            python scripts/apply_hevy_first_builder.py
            python -m pip install -r backend/requirements.txt
            python -m ruff check --fix \
              backend/dynamic_programme.py \
              backend/hevy_reader.py \
              backend/database.py \
              backend/webapp/app.py \
              backend/tests/test_dynamic_programme.py \
              backend/tests/test_webapp_programmes.py
            python -m ruff format \
              backend/dynamic_programme.py \
              backend/hevy_reader.py \
              backend/database.py \
              backend/webapp/app.py \
              backend/tests/test_dynamic_programme.py \
              backend/tests/test_webapp_programmes.py
            python -m ruff check \
              backend/dynamic_programme.py \
              backend/hevy_reader.py \
              backend/database.py \
              backend/webapp/app.py \
              backend/tests/test_dynamic_programme.py \
              backend/tests/test_webapp_programmes.py
            cd backend
            python -m pytest -q \
              tests/test_dynamic_programme.py \
              tests/test_webapp_programmes.py \
              tests/test_hevy_reader.py \
              tests/test_programme_inference.py \
              tests/test_database.py
            python -m pytest -q tests
            python -m mypy dynamic_programme.py hevy_reader.py webapp/app.py
            python -m compileall -q .
            python -c "import dynamic_programme; import webapp.app; import main"
            cd ../frontend
            npm install --global npm@11.12.1
            npm ci
            npm run build
            cd ..
            if grep -R -n -E 'Available Templates|Active Split Preview|Hybrid Powerbuilding' frontend/src; then
              echo "Legacy static programme copy remains in the frontend."
              exit 1
            fi
            git diff --check
          } 2>&1 | tee hevy-builder-run.log

      - name: Publish verified implementation
        if: success()
        shell: bash
        run: |
          rm -f hevy-builder-run.log
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Hevy-first dynamic programme builder (#967)"
          git push origin HEAD:feat/967-hevy-first-builder-v1

      - name: Record verification failure on feature branch
        if: failure()
        shell: bash
        run: |
          cp hevy-builder-run.log /tmp/hevy-builder-run.log || true
          git reset --hard HEAD
          git clean -fd
          cp /tmp/hevy-builder-run.log hevy-builder-run.log || printf 'Verification failed before a log was created.\n' > hevy-builder-run.log
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hevy-builder-run.log
          git commit -m "ci: record Hevy-first builder verification failure" || true
          git push origin HEAD:feat/967-hevy-first-builder-v1
