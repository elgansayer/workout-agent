name: Finalise Source Integrity Repair

on:
  push:
    branches:
      - fix/webapp-main-integrity
    paths:
      - .github/workflows/finalise-source-integrity.yml

concurrency:
  group: finalise-source-integrity-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/webapp-main-integrity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Align restored provider and persistence contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("webapp/app.py")
          app = app_path.read_text(encoding="utf-8")
          old_provider = (
              "        fallback_api_key=config.gemini_api_key,\n"
              "        fallback_model=config.gemini_model,\n"
          )
          new_provider = (
              "        server_gemini_key=config.gemini_api_key,\n"
              "        server_gemini_model=config.gemini_model,\n"
          )
          if app.count(old_provider) != 1:
              raise SystemExit("expected exactly one legacy provider call")
          app_path.write_text(
              app.replace(old_provider, new_provider),
              encoding="utf-8",
          )

          database_path = Path("database.py")
          database = database_path.read_text(encoding="utf-8")

          old_progress = (
              "def save_progress(\n"
              "    summary: WorkoutSummary | None, db_path: str = DEFAULT_DB_PATH\n"
              ") -> None:\n"
          )
          new_progress = (
              "def save_progress(\n"
              "    summary: WorkoutSummary | None,\n"
              "    db_path: str = DEFAULT_DB_PATH,\n"
              "    *,\n"
              "    user_id: str | None = None,\n"
              ") -> None:\n"
          )
          if database.count(old_progress) != 1:
              raise SystemExit("expected exactly one damaged save_progress signature")
          database = database.replace(old_progress, new_progress)

          old_chat = (
              "def save_chat_message(role: str, content: str, "
              "db_path: str = DEFAULT_DB_PATH) -> None:\n"
          )
          new_chat = (
              "def save_chat_message(\n"
              "    role: str,\n"
              "    content: str,\n"
              "    db_path: str = DEFAULT_DB_PATH,\n"
              "    *,\n"
              "    user_id: str | None = None,\n"
              ") -> None:\n"
          )
          if database.count(old_chat) != 1:
              raise SystemExit("expected exactly one damaged save_chat_message signature")
          database = database.replace(old_chat, new_chat)

          old_chat_values = (
              "            (role, content, "
              "datetime.now(tz=timezone.utc).isoformat()),\n"
          )
          new_chat_values = (
              "            (\n"
              "                role,\n"
              "                content,\n"
              "                datetime.now(tz=timezone.utc).isoformat(),\n"
              "                user_id,\n"
              "            ),\n"
          )
          if database.count(old_chat_values) != 1:
              raise SystemExit("expected exactly one damaged chat insert values tuple")
          database_path.write_text(
              database.replace(old_chat_values, new_chat_values),
              encoding="utf-8",
          )
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-web.txt "pytest>=8,<9"

      - name: Validate repaired source and web/database contracts
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
        shell: bash
        run: |
          matches="$(git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- '*.py' '*.yml' '*.yaml' '*.toml' '*.json' '*.sh' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            exit 1
          fi
          mapfile -d '' files < <(git ls-files -z '*.py')
          python -m py_compile "${files[@]}"
          python -m pytest -q tests/test_webapp.py tests/test_database.py

      - name: Commit verified final repair
        shell: bash
        run: |
          git rm .github/workflows/finalise-source-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/app.py database.py
          git commit -m "fix: align restored provider and persistence contracts"
          git push origin HEAD:fix/webapp-main-integrity
