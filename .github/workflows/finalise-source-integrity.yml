name: Finalise Source Integrity Repair

on:
  push:
    branches:
      - fix/webapp-main-integrity
    paths:
      - .github/workflows/finalise-source-integrity.yml

concurrency:
  group: finalise-source-integrity-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/webapp-main-integrity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Align provider contract and strengthen CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("webapp/app.py")
          app = app_path.read_text(encoding="utf-8")
          old_call = """        fallback_api_key=config.gemini_api_key,\n        fallback_model=config.gemini_model,\n"""
          new_call = """        server_gemini_key=config.gemini_api_key,\n        server_gemini_model=config.gemini_model,\n"""
          if app.count(old_call) != 1:
              raise SystemExit("expected exactly one legacy provider call")
          app_path.write_text(app.replace(old_call, new_call), encoding="utf-8")

          workflow_path = Path(".github/workflows/diagnose-python-integrity.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_install = "run: python -m pip install -r requirements.txt -r requirements-web.txt"
          new_install = (
              'run: python -m pip install -r requirements.txt '
              '-r requirements-web.txt "pytest>=8,<9"'
          )
          if workflow.count(old_install) != 1:
              raise SystemExit("expected exactly one runtime dependency install step")
          workflow = workflow.replace(old_install, new_install)
          focused_step = """

      - name: Run focused integrity regressions
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
        run: >-
          python -m pytest -q
          tests/test_webapp.py::test_google_health_disconnect_clears_token
          tests/test_webapp.py::test_api_programmes_select_requires_auth
          tests/test_webapp.py::test_rag_search_uses_resolve_provider
"""
          if "Run focused integrity regressions" in workflow:
              raise SystemExit("focused regression step already exists")
          workflow_path.write_text(workflow.rstrip() + focused_step, encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-web.txt "pytest>=8,<9"

      - name: Validate repaired source and focused routes
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
        shell: bash
        run: |
          matches="$(git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- '*.py' '*.yml' '*.yaml' '*.toml' '*.json' '*.sh' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            exit 1
          fi
          mapfile -d '' files < <(git ls-files -z '*.py')
          python -m py_compile "${files[@]}"
          python -m pytest -q \
            tests/test_webapp.py::test_google_health_disconnect_clears_token \
            tests/test_webapp.py::test_api_programmes_select_requires_auth \
            tests/test_webapp.py::test_rag_search_uses_resolve_provider

      - name: Commit verified final repair
        shell: bash
        run: |
          git rm .github/workflows/finalise-source-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/app.py .github/workflows/diagnose-python-integrity.yml
          git commit -m "fix: align provider contract and add focused integrity tests"
          git push origin HEAD:fix/webapp-main-integrity
