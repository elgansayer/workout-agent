name: Finalise Source Integrity Repair

on:
  push:
    branches:
      - fix/webapp-main-integrity
    paths:
      - .github/workflows/finalise-source-integrity.yml

concurrency:
  group: finalise-source-integrity-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/webapp-main-integrity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Align the provider call with the restored contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("webapp/app.py")
          source = path.read_text(encoding="utf-8")
          old = (
              "        fallback_api_key=config.gemini_api_key,\n"
              "        fallback_model=config.gemini_model,\n"
          )
          new = (
              "        server_gemini_key=config.gemini_api_key,\n"
              "        server_gemini_model=config.gemini_model,\n"
          )
          if source.count(old) != 1:
              raise SystemExit("expected exactly one legacy provider call")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-web.txt "pytest>=8,<9"

      - name: Validate repaired source and focused routes
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
        shell: bash
        run: |
          matches="$(git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- '*.py' '*.yml' '*.yaml' '*.toml' '*.json' '*.sh' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            exit 1
          fi
          mapfile -d '' files < <(git ls-files -z '*.py')
          python -m py_compile "${files[@]}"
          python -m pytest -q \
            tests/test_webapp.py::test_google_health_disconnect_clears_token \
            tests/test_webapp.py::test_api_programmes_select_requires_auth \
            tests/test_webapp.py::test_rag_search_uses_resolve_provider

      - name: Commit verified final repair
        shell: bash
        run: |
          git rm .github/workflows/finalise-source-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/app.py
          git commit -m "fix: align the web provider call with its restored contract"
          git push origin HEAD:fix/webapp-main-integrity
