name: Agent Weekly Tasks

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  queue-tasks:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Queue weekly automation tasks as GitHub issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd .agents/automations
          tasks=(
            "task-weekly-db-migration-review.md"
            "task-weekly-coverage-report.md"
            "task-weekly-ai-provider-parity-audit.md"
            "task-weekly-ux-audit.md"
          )
          for task in "${tasks[@]}"; do
            title=$(head -n 1 "$task" | sed 's/^# //')
            existing=$(gh issue list --state open --search "$title" --json number -q '.[0].number' || true)
            if [ -z "$existing" ]; then
              gh issue create --title "[Weekly] $title" --body-file "$task" --label "ai-agent-task,weekly"
            else
              echo "Skipping duplicate: $title (issue #$existing already open)"
            fi
          done
