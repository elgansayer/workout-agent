name: Python Source Integrity

on:
  pull_request:
    paths:
      - "**/*.py"
      - "backend/requirements*.txt"
      - ".github/workflows/diagnose-python-integrity.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "backend/requirements*.txt"
      - ".github/workflows/diagnose-python-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-web.txt

      - name: Reject unresolved merge markers
        id: markers
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          matches="$(git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- '*.py' '*.yml' '*.yaml' '*.toml' '*.json' '*.sh' || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "No unresolved merge markers found in source/config files."

      - name: Compile every tracked Python file
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.py')
          python -m py_compile "${files[@]}"

      - name: Enforce source integrity
        if: always()
        env:
          MARKERS: ${{ steps.markers.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          echo "merge-marker scan: $MARKERS"
          echo "Python compilation: $COMPILE"
          [[ "$MARKERS" == "success" && "$COMPILE" == "success" ]]

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-web.txt

      # Compilation cannot detect undefined bases, missing imports, or broken
      # cross-module symbols introduced by an automatic merge.
      - name: Import production modules
        working-directory: backend
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
        run: |
          # webapp.app validates its Angular asset directory at import time.
          # The import smoke test does not build the frontend, so provide the
          # empty directory that production images populate during their build.
          mkdir -p ../frontend/dist/frontend/browser
          python - <<'PY'
          import ai_provider
          import analytics
          import database
          import insight_cron
          import webapp.app

          print("Production module imports succeeded.")
          PY
