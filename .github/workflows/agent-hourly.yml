name: Agent Hourly Tasks

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  queue-tasks:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Queue hourly automation tasks as GitHub issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd .agents/automations
          tasks=(
            "task-hourly-lint-fix.md"
            "task-hourly-type-check.md"
            "task-hourly-test-watch.md"
            "task-hourly-dead-code.md"
            "task-hourly-commit-hygiene.md"
          )
          for task in "${tasks[@]}"; do
            title=$(head -n 1 "$task" | sed 's/^# //')
            existing=$(gh issue list --state open --search "$title" --json number -q '.[0].number' || true)
            if [ -z "$existing" ]; then
              gh issue create --title "[Hourly] $title" --body-file "$task" --label "ai-agent-task,hourly"
            else
              echo "Skipping duplicate: $title (issue #$existing already open)"
            fi
          done
