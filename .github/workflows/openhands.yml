name: Retired GitHub-Hosted AI Auto-Resolver

# Issue implementation is owned by the OpenHands Agent Canvas daemon on the
# VPS. Keep the former comment-triggered GitHub Actions resolver inert to
# avoid duplicate agents, credential spend, and recursive PR creation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The GitHub-hosted AI auto-resolver is retired."
          echo "The OpenHands daemon on the VPS owns implementation."
          echo "No commits, comments, issues, or pull requests were changed."
