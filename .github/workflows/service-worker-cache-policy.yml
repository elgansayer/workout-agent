name: Service Worker Cache Policy

on:
  pull_request:
    paths:
      - "backend/webapp/static/sw.js"
      - "backend/webapp/static/offline.html"
      - "frontend/public/sw.js"
      - "frontend/public/offline.html"
      - "backend/tests/test_service_worker_cache_policy.py"
      - ".github/workflows/service-worker-cache-policy.yml"
  push:
    branches:
      - main
    paths:
      - "backend/webapp/static/sw.js"
      - "backend/webapp/static/offline.html"
      - "frontend/public/sw.js"
      - "frontend/public/offline.html"
      - "backend/tests/test_service_worker_cache_policy.py"
      - ".github/workflows/service-worker-cache-policy.yml"

permissions:
  contents: read

jobs:
  cache-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check service-worker JavaScript syntax
        run: |
          node --check backend/webapp/static/sw.js
          node --check frontend/public/sw.js

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Run cache-isolation regression tests
        run: python -m pytest -q backend/tests/test_service_worker_cache_policy.py
