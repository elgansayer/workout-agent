name: Retired Pull Request Reviewer Agent

# Pull-request review automation must remain deterministic; OpenHands handles
# review feedback through the VPS control plane. This retired workflow cannot
# review, approve, modify, or merge a pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The GitHub-hosted PR reviewer is retired; no review was submitted."
