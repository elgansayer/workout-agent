name: Retired GitHub-Hosted PR Reviewer

# Review decisions and repairs belong to the OpenHands control plane on the
# VPS and repository maintainers. This GitHub-hosted autonomous reviewer is
# retained only as an explicit retirement record.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The GitHub-hosted PR reviewer is retired; no review was submitted."
