name: Retired GitHub-Hosted AI PR Reviewer

# Pull-request review and repair is owned by the OpenHands Agent Canvas daemon
# on the VPS. Keep this workflow inert to prevent subscription/API usage,
# recursive commits, and unattended admin merges from GitHub-hosted agents.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "The GitHub-hosted AI PR reviewer is retired."
          echo "The OpenHands daemon on the VPS owns code review and repair."
          echo "No commits, reviews, issue comments, or merges were performed."
