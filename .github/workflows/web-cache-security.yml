name: Web Cache Security

on:
  pull_request:
    paths:
      - "backend/webapp/cache_security.py"
      - "backend/webapp/__init__.py"
      - "backend/webapp/app.py"
      - "backend/tests/test_web_cache_security.py"
      - "frontend/src/app/components/settings/settings.ts"
      - "frontend/src/app/components/settings/settings.html"
      - ".github/workflows/web-cache-security.yml"
  push:
    branches:
      - main
    paths:
      - "backend/webapp/cache_security.py"
      - "backend/webapp/__init__.py"
      - "backend/webapp/app.py"
      - "backend/tests/test_web_cache_security.py"
      - "frontend/src/app/components/settings/settings.ts"
      - "frontend/src/app/components/settings/settings.html"
      - ".github/workflows/web-cache-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-web.txt

      - name: Install backend test dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -r backend/requirements-web.txt
          "pytest>=8,<9"

      - name: Compile cache security boundary
        run: >-
          python -m py_compile
          backend/webapp/cache_security.py
          backend/webapp/__init__.py

      - name: Run cache and credential regression tests
        env:
          APP_ENV: test
          ALLOW_ANONYMOUS_WEB: "1"
          WEB_ALLOW_ANONYMOUS: "1"
        run: >-
          python -m pytest -q
          backend/tests/test_web_cache_security.py
