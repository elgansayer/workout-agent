name: Privacy data-flow inventory

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/PRIVACY.md"
      - "docs/data-flow-inventory.json"
      - "tools/validate_data_flow_inventory.py"
      - "tools/test_data_flow_inventory.py"
      - ".github/workflows/data-flow-inventory.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/PRIVACY.md"
      - "docs/data-flow-inventory.json"
      - "tools/validate_data_flow_inventory.py"
      - "tools/test_data_flow_inventory.py"
      - ".github/workflows/data-flow-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate machine-readable inventory
        run: python tools/validate_data_flow_inventory.py
      - name: Run inventory regression tests
        run: python -m unittest tools.test_data_flow_inventory
