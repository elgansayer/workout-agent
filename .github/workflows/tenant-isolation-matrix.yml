name: Tenant isolation matrix

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/TENANT_ISOLATION.md"
      - "docs/TENANT_ISOLATION_MATRIX.md"
      - ".github/workflows/tenant-isolation-matrix.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/TENANT_ISOLATION.md"
      - "docs/TENANT_ISOLATION_MATRIX.md"
      - ".github/workflows/tenant-isolation-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-web.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-web.txt

      - name: Prove tenant isolation with two synthetic tenants
        run: python -m pytest -q backend/tests/test_tenant_isolation_matrix.py

      - name: Check the generated matrix is current
        run: python backend/scripts/tenant_isolation_matrix.py --check
