name: Web Runtime Security

on:
  pull_request:
    paths:
      - webapp/runtime_security.py
      - webapp/__init__.py
      - tests/test_web_runtime_security.py
      - conftest.py
      - Dockerfile.web
      - docker-compose.yml
      - docker-compose.portainer.yml
      - .env.example
      - .github/workflows/web-runtime-security.yml
  push:
    branches: [main]
    paths:
      - webapp/runtime_security.py
      - webapp/__init__.py
      - tests/test_web_runtime_security.py
      - conftest.py
      - Dockerfile.web
      - docker-compose.yml
      - docker-compose.portainer.yml
      - .env.example
      - .github/workflows/web-runtime-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Compile runtime security modules
        run: >-
          python -m py_compile
          webapp/runtime_security.py
          webapp/__init__.py
          tests/test_web_runtime_security.py

      - name: Run fail-closed runtime tests
        run: python -m pytest -q tests/test_web_runtime_security.py
