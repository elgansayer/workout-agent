name: Web Runtime Security

on:
  pull_request:
    paths:
      - backend/webapp/runtime_security.py
      - backend/webapp/__init__.py
      - backend/tests/test_web_runtime_security.py
      - backend/conftest.py
      - Dockerfile.web
      - docker-compose.yml
      - docker-compose.portainer.yml
      - .env.example
      - .github/workflows/web-runtime-security.yml
  push:
    branches: [main]
    paths:
      - backend/webapp/runtime_security.py
      - backend/webapp/__init__.py
      - backend/tests/test_web_runtime_security.py
      - backend/conftest.py
      - Dockerfile.web
      - docker-compose.yml
      - docker-compose.portainer.yml
      - .env.example
      - .github/workflows/web-runtime-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Compile runtime security modules
        run: >-
          python -m py_compile
          backend/webapp/runtime_security.py
          backend/webapp/__init__.py
          backend/tests/test_web_runtime_security.py

      - name: Run fail-closed runtime tests
        working-directory: backend
        run: python -m pytest -q tests/test_web_runtime_security.py
