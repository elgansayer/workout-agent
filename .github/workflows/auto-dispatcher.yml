name: Retired Auto Dispatcher

# Issue selection and dispatch belong to the OpenHands control plane on the
# VPS. This inert record cannot claim issues, create branches, or dispatch an
# autonomous GitHub-hosted coding agent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The GitHub-hosted auto-dispatcher is retired; no work was dispatched."
