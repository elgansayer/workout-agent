name: Retired Legacy Swarm Auto-Dispatcher

# The OpenHands daemon running on the VPS is the single owner of issue
# selection and implementation scheduling. This workflow is intentionally
# inert so that newly created product issues are not claimed by the retired
# GitHub-hosted dispatcher.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "This dispatcher is retired."
          echo "The OpenHands Agent Canvas daemon on the VPS owns scheduling."
          echo "No issue labels, comments, project fields, or pull requests were changed."
