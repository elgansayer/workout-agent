name: Retired Auto Dispatcher

# GitHub-hosted issue dispatch is retired. Repo Factory and OpenHands Agent
# Canvas on the VPS exclusively own issue selection and task dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The GitHub-hosted auto-dispatcher is retired; no task was dispatched."
