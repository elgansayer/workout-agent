name: Retired Architect Agent

# Architecture planning belongs to the OpenHands control plane on the VPS.
# This inert record remains only to prevent the retired GitHub-hosted agent
# from being recreated with autonomous triggers or repository write access.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The GitHub-hosted architect agent is retired; no plans were authored."
