name: Agent Daily Tasks

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  queue-tasks:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Queue daily automation tasks as GitHub issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd .agents/automations
          tasks=(
            "task-daily-security-audit.md"
            "task-daily-multi-tenant-isolation-audit.md"
            "task-daily-connector-health-check.md"
            "task-daily-dependency-update.md"
            "task-daily-documentation-sync.md"
          )
          for task in "${tasks[@]}"; do
            title=$(head -n 1 "$task" | sed 's/^# //')
            existing=$(gh issue list --state open --search "$title" --json number -q '.[0].number' || true)
            if [ -z "$existing" ]; then
              gh issue create --title "[Daily] $title" --body-file "$task" --label "ai-agent-task,daily"
            else
              echo "Skipping duplicate: $title (issue #$existing already open)"
            fi
          done
