name: Data classification policy

on:
  pull_request:
    paths:
      - 'README.md'
      - 'current-workout.md'
      - 'backend/**/*.py'
      - 'backend/**/fixtures/**'
      - 'docs/**/*.md'
      - '.github/workflows/data-classification-policy.yml'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'current-workout.md'
      - 'backend/**/*.py'
      - 'backend/**/fixtures/**'
      - 'docs/**/*.md'
      - '.github/workflows/data-classification-policy.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Compile policy code
        working-directory: backend
        run: python -m py_compile data_classification.py scripts/check_data_policy.py tests/test_data_classification.py tests/test_data_policy_check.py
      - name: Run focused policy tests
        working-directory: backend
        run: python -m pytest -q tests/test_data_classification.py tests/test_data_policy_check.py
      - name: Scan repository policy boundaries
        working-directory: backend
        run: python scripts/check_data_policy.py
