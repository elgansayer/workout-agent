name: Production release policy

on:
  pull_request:
    paths:
      - '.github/workflows/build-images.yml'
      - '.github/workflows/production-release.yml'
      - '.github/workflows/production-release-policy.yml'
      - 'tools/check_auto_release.py'
      - 'tools/test_auto_release.py'
      - 'tools/deployment_receipt.py'
      - 'tools/test_deployment_receipt.py'
      - 'backend/release_gate.py'
      - 'backend/tests/test_release_gate.py'
      - 'docs/PRODUCTION_RELEASE_CHECKLIST.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-images.yml'
      - '.github/workflows/production-release.yml'
      - '.github/workflows/production-release-policy.yml'
      - 'tools/check_auto_release.py'
      - 'tools/test_auto_release.py'
      - 'tools/deployment_receipt.py'
      - 'tools/test_deployment_receipt.py'
      - 'backend/release_gate.py'
      - 'backend/tests/test_release_gate.py'
      - 'docs/PRODUCTION_RELEASE_CHECKLIST.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install focused test dependencies
        run: >-
          python3 -m pip install
          'pytest>=8,<9'

      - name: Compile release policy
        run: >-
          python3 -m py_compile
          backend/release_gate.py
          backend/tests/test_release_gate.py
          tools/deployment_receipt.py
          tools/test_deployment_receipt.py

      - name: Run release-gate regression tests
        working-directory: backend
        run: python3 -m pytest -q tests/test_release_gate.py
      - name: Verify automatic eligibility checks and negative cases
        run: python3 -m unittest tools.test_auto_release -v
      - name: Validate server backup receipt and release correlation
        run: python3 -m pytest -q tools/test_deployment_receipt.py
      - name: Verify the workflow token can read enforced release requirements
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main"
          --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context]'
